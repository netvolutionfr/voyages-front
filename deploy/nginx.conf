server {
  listen 80;
  server_name _;

  # En-têtes de sécurité : le snippet est ré-inclus dans CHAQUE location.
  # nginx n'hérite les `add_header` d'un niveau supérieur que si le niveau courant
  # n'en définit aucun ; comme plusieurs locations posent leur propre Cache-Control
  # ou Content-Type, on inclut le snippet partout pour garantir les en-têtes sur
  # toutes les réponses.

  # Assets Vite hashés => cache long
  location /assets/ {
    root   /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html => pas de cache pour permettre les refreshs de version
  location = /index.html {
    root   /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    root   /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }

  # health
  location = /health {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}
