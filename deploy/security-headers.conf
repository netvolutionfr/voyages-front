# En-têtes de sécurité communs à toutes les réponses.
# Inclus explicitement dans chaque `location` de nginx.conf : nginx n'hérite
# les `add_header` d'un niveau supérieur que si le niveau courant n'en définit
# aucun, or plusieurs locations posent leur propre Cache-Control/Content-Type.

# Empêche le MIME-sniffing (défense en profondeur pour l'aperçu de documents).
add_header X-Content-Type-Options "nosniff" always;

# Anti-clickjacking. `frame-ancestors` (CSP) est la version moderne, mais XFO
# reste honoré par les navigateurs plus anciens et s'applique dès maintenant.
add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Désactive des fonctionnalités puissantes inutilisées. WebAuthn n'est pas listé,
# donc `publickey-credentials-*` conserve sa valeur par défaut (self) : passkeys OK.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# HSTS : ignoré par les navigateurs sur HTTP, n'agit que derrière HTTPS.
# À ajuster si des sous-domaines sont servis en clair (retirer includeSubDomains).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP livrée en Report-Only : ne casse pas le rendu, signale seulement les
# violations dans la console du navigateur. À promouvoir en `Content-Security-Policy`
# (enforcing) après validation, idéalement avec les origines API/fichiers épinglées
# à la place des `https:` génériques de connect-src/img-src.
#
#   script-src  'self'                    -> modules Vite (aucun script inline attendu)
#   style-src   'self' 'unsafe-inline'    -> styles inline Radix/shadcn + Tailwind
#   img-src     ... blob: https:          -> aperçu blob + photos de couverture (CDN)
#   connect-src 'self' https:             -> appels API (VITE_API_URL, origine variable)
#   object-src  'self' blob:              -> aperçu PDF via <embed src=blob:>
#   frame-ancestors 'none'                -> anti-clickjacking (enforcing une fois promu)
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
